# Render Blueprint for CampusFind AI (free web service).
# Ollama cannot run on Render's free plan, so the hosted app uses the rule-based engine
# (LLM_PROVIDER=rules) and structured-only matching (EMBEDDING_PROVIDER=none).
# Secret values (sync: false) are typed into the Render dashboard, never committed.
services:
  - type: web
    name: campusfind-ai-agent
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: rules
      - key: EMBEDDING_PROVIDER
        value: none
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
