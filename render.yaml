# Render Blueprint for CampusFind AI (free web service: no card needed, $0).
# Free plan facts (render.com/docs/free): sleeps after 15 min without traffic (first visit then
# takes about a minute), 750 free instance hours per month, small instance (about 512 MB RAM).
# Ollama cannot run there and must NOT point at a personal laptop, so the hosted app uses the
# rule-based engine (LLM_PROVIDER=rules) and structured-only matching (EMBEDDING_PROVIDER=none).
# One instance + in-memory rate limits (counters are per process; see app/ratelimit.py).
# Secret values (sync: false) are typed into the Render dashboard, never committed.
services:
  - type: web
    name: campusfind-ai-agent
    runtime: python
    plan: free
    # Deploy automatically every time a new commit is pushed to the linked branch (main).
    autoDeployTrigger: commit
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: rules
      - key: EMBEDDING_PROVIDER
        value: none
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
